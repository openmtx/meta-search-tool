name: Publish mst-python to PyPI

on:
  push:
    tags:
      - "v*"  # same tag as the CLI (release.yml) — one tag releases both
  workflow_dispatch:  # allow manual trigger for testing (build+test only; no upload)

permissions:
  contents: write
  id-token: write  # required for trusted publishing (PyPI)

jobs:
  build-wheels:
    name: Build wheels ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      # The tag is the single version source for both the CLI and this package.
      # setup.py strips the leading 'v' (PyPI needs '0.4.0', not 'v0.4.0').
      MST_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
    strategy:
      matrix:
        include:
          # Linux — ubuntu-latest has Go + gcc pre-installed
          - os: ubuntu-latest
            python: cp311-cp311
            tag: manylinux_x86_64
          - os: ubuntu-latest
            python: cp312-cp312
            tag: manylinux_x86_64
          - os: ubuntu-latest
            python: cp313-cp313
            tag: manylinux_x86_64
          # macOS Intel (macos-13)
          - os: macos-13
            python: cp311-cp311
            tag: macosx_x86_64
          - os: macos-13
            python: cp312-cp312
            tag: macosx_x86_64
          - os: macos-13
            python: cp313-cp313
            tag: macosx_x86_64
          # macOS Apple Silicon (macos-14)
          - os: macos-14
            python: cp311-cp311
            tag: macosx_arm64
          - os: macos-14
            python: cp312-cp312
            tag: macosx_arm64
          - os: macos-14
            python: cp313-cp313
            tag: macosx_arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go (needed for CGO build)
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build
          pip install cython pytest

      - name: Build wheel
        env:
          CGO_ENABLED: "1"
        run: |
          cd python
          python -m build --wheel

      - name: Test the built wheel (deterministic suite; no network)
        run: |
          pip install --force-reinstall --no-deps python/dist/*.whl
          cd python && python -m pytest -q

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.tag }}
          path: python/dist/*.whl
          if-no-files-found: error

  upload:
    name: Upload to PyPI
    needs: [build-wheels]
    if: startsWith(github.ref, 'refs/tags/v')  # never publish on workflow_dispatch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: Check distributions
        run: twine check dist/*

      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
