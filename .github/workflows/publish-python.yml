name: Publish mst-python to PyPI

on:
  push:
    tags:
      - "v*"  # same tag as the CLI (release.yml) — one tag releases both
  workflow_dispatch:  # build+test; set `tag` to publish a recovery build for an existing tag
    inputs:
      tag:
        description: "Existing release tag to publish (e.g. v0.5.0); leave empty to build+test only"
        required: false
        type: string

permissions:
  contents: write
  id-token: write  # required for trusted publishing (PyPI)

jobs:
  pin-check:
    name: Verify skill pin matches release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check skills/web-search pin
        run: ./scripts/check_skill_pin.sh "${{ inputs.tag }}"

  # --- Linux: build in a manylinux_2_34 container ---------------------------
  # Go's c-shared runtime (go.mod "go 1.26") references GLIBC_2.34 symbols, so
  # the wheel floor is manylinux_2_34 (RHEL 9 / Ubuntu 22.04+). Building on
  # ubuntu-latest and repairing with auditwheel fails (too-new glibc symbols),
  # so we build inside the container, then auditwheel-repair to the same plat.
  build-linux:
    name: manylinux_2_34 x86_64 · Python ${{ matrix.py }}
    runs-on: ubuntu-latest
    needs: pin-check
    env:
      MST_VERSION: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}
    strategy:
      fail-fast: false
      matrix:
        py: [311, 312, 313, 314]
    steps:
      - uses: actions/checkout@v4

      - name: Build + repair manylinux_2_34 wheel
        run: |
          docker run --rm \
            -v "$PWD":/work -w /work \
            -e MST_VERSION="$MST_VERSION" \
            -e PY="$PY" \
            quay.io/pypa/manylinux_2_34_x86_64 bash -c '
              set -euxo pipefail
              # Install Go — pin matches go.mod "go 1.26"; bump with the directive.
              curl -sSL https://go.dev/dl/go1.26.4.linux-amd64.tar.gz | tar -C /usr/local -xz
              export PATH=/usr/local/go/bin:$PATH CGO_ENABLED=1

              PY=$PY
              PYBIN=/opt/python/$PY/bin

              "$PYBIN/python" -m pip install --upgrade --quiet build cython auditwheel
              ( cd /work/python && "$PYBIN/python" -m build --wheel )
              "$PYBIN/python" -m auditwheel repair /work/python/dist/*.whl \
                -w /work/wheels --plat manylinux_2_34_x86_64 || true
              rm -rf /work/python/dist /work/python/build \
                     /work/python/src/mst/_mst.c /work/python/src/mst.egg-info
            '
        env:
          PY: "cp${{ matrix.py }}-cp${{ matrix.py }}"

      - name: Upload Linux wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.py }}
          path: wheels/*.whl
          if-no-files-found: error

  # --- macOS: native build (no auditwheel needed; libSystem is system) -------
  build-macos:
    name: macOS ${{ matrix.arch }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    needs: pin-check
    env:
      CGO_ENABLED: "1"
      # Build compatible arm64 wheels even when the hosted runner is a newer
      # macOS (pip's tag would otherwise become macosx_26_0 and exclude older
      # macOS releases).
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      # Force the wheel platform tag too; macOS 26's sysconfig otherwise wins.
      _PYTHON_HOST_PLATFORM: macosx-11.0-arm64
      MST_VERSION: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest = Apple Silicon (arm64). Intel (macos-13) runners have
          # chronic queue delays on GH Actions; users on Intel Macs can use the
          # Go CLI binary (darwin-amd64) built by release.yml or pip install
          # from source.
          - { os: macos-latest, arch: arm64, python: "3.11" }
          - { os: macos-latest, arch: arm64, python: "3.12" }
          - { os: macos-latest, arch: arm64, python: "3.13" }
          - { os: macos-latest, arch: arm64, python: "3.14" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"

      - name: Build wheel
        run: |
          python -m pip install --upgrade --quiet build cython
          cd python && python -m build --wheel

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.arch }}-${{ matrix.python }}
          path: python/dist/*.whl
          if-no-files-found: error

  # --- Windows: native build (CGO produces .dll on Windows) -----------------
  build-windows:
    name: Windows x64 · Python ${{ matrix.python }}
    runs-on: windows-latest
    needs: pin-check
    env:
      CGO_ENABLED: "1"
      MST_VERSION: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"

      - name: Build wheel
        run: |
          python -m pip install --upgrade --quiet build cython
          cd python
          python -m build --wheel

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.python }}
          path: python/dist/*.whl
          if-no-files-found: error

  # --- Verify every built wheel on its matching platform and Python ---------
  # Building proves compilation; only installation proves the artifact works.
  # v0.4.0/v0.4.1 shipped no usable win_amd64/cp314 wheels and nothing in CI
  # noticed — users hit a CGO source build instead. This gate installs the
  # exact bytes that will be uploaded into a fresh venv on the matching
  # runner/CPython and runs the offline test suite against them. The suite is
  # deterministic (spec §14): no network, no timing races.
  verify-wheels:
    name: Verify wheel · ${{ matrix.os }} · Python ${{ matrix.python }}
    needs: [build-linux, build-macos, build-windows]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest glibc (2.39) >= 2.34, so manylinux_2_34 wheels load.
          - { os: ubuntu-latest, python: "3.11", artifact: wheels-linux-311 }
          - { os: ubuntu-latest, python: "3.12", artifact: wheels-linux-312 }
          - { os: ubuntu-latest, python: "3.13", artifact: wheels-linux-313 }
          - { os: ubuntu-latest, python: "3.14", artifact: wheels-linux-314 }
          - { os: macos-latest, python: "3.11", artifact: wheels-macos-arm64-3.11 }
          - { os: macos-latest, python: "3.12", artifact: wheels-macos-arm64-3.12 }
          - { os: macos-latest, python: "3.13", artifact: wheels-macos-arm64-3.13 }
          - { os: macos-latest, python: "3.14", artifact: wheels-macos-arm64-3.14 }
          - { os: windows-latest, python: "3.11", artifact: wheels-windows-3.11 }
          - { os: windows-latest, python: "3.12", artifact: wheels-windows-3.12 }
          - { os: windows-latest, python: "3.13", artifact: wheels-windows-3.13 }
          - { os: windows-latest, python: "3.14", artifact: wheels-windows-3.14 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: wheel/

      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"

      - name: Install wheel into a fresh venv
        run: |
          python -m venv .venv-verify
          VENV_PY=".venv-verify/bin/python"
          [[ "$RUNNER_OS" == "Windows" ]] && VENV_PY=".venv-verify/Scripts/python.exe"
          "$VENV_PY" -m pip install --upgrade --quiet pip
          "$VENV_PY" -m pip install --quiet pytest
          "$VENV_PY" -m pip install --quiet wheel/*.whl

      # Guard against the suite silently testing the source tree instead of the
      # wheel (conftest.py falls back to src/ when mst is not importable).
      - name: Assert the wheel is what is imported
        run: |
          VENV_PY=".venv-verify/bin/python"
          [[ "$RUNNER_OS" == "Windows" ]] && VENV_PY=".venv-verify/Scripts/python.exe"
          "$VENV_PY" - <<'EOF'
          import pathlib, sysconfig
          import mst
          expected_root = pathlib.Path(sysconfig.get_paths()["purelib"]).resolve()
          actual = pathlib.Path(mst.__file__).resolve()
          assert expected_root in actual.parents, (
              f"mst imported from {actual}, expected under {expected_root}")
          print(f"mst loaded from wheel: {actual}")
          EOF

      - name: Run offline test suite against the wheel
        run: |
          VENV_PY=".venv-verify/bin/python"
          [[ "$RUNNER_OS" == "Windows" ]] && VENV_PY=".venv-verify/Scripts/python.exe"
          "$VENV_PY" -m pytest python/tests -q

  # --- Coverage gate: the exact wheel set must exist before upload -----------
  # A matrix leg can succeed while producing no wheel (or the wrong platform
  # tag). v0.4.0 shipped no Windows/3.14 wheels; `twine check` would not have
  # caught it because twine only sees metadata of files that exist. This gate
  # asserts every expected (platform, CPython) combination is present with the
  # right tag, and runs twine's metadata check over the full set.
  wheel-coverage:
    name: Wheel coverage and metadata
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: Assert every expected wheel exists with the right platform tag
        run: |
          python - <<'EOF'
          import re
          from pathlib import Path

          wheels = sorted(p.name for p in Path("dist").glob("*.whl"))
          # (python-tag fragment, required platform-tag fragment) per artifact.
          expected = [
              (f"cp{py}", marker)
              for py in ("311", "312", "313", "314")
              for marker in ("manylinux_2_34_x86_64", "macosx", "win_amd64")
          ]
          missing = [
              (py, marker) for py, marker in expected
              if sum(1 for name in wheels if py in name and marker in name) != 1
          ]
          if missing:
              raise SystemExit(
                  f"Wheel coverage incomplete for {missing}; got: {wheels}. "
                  "Every platform x CPython leg must ship exactly one wheel — "
                  "v0.4.0 shipped no win_amd64/cp314 wheels and users fell back "
                  "to a CGO source build.")
          assert len(wheels) == len(expected), f"unexpected extra wheels: {wheels}"
          print(f"All {len(expected)} expected wheels present:")
          for name in wheels:
              print(f"  {name}")
          EOF

      - name: Metadata check
        run: |
          python -m pip install --quiet twine
          twine check dist/*

  # --- Live engine smoke over the shipped wheel (non-blocking) ---------------
  # Deterministic gates above prove the binding works; this proves a release
  # can actually fetch results from real engines. Runs live (MST_ITEST=1, spec
  # §14) against one Linux wheel. Engine flakiness/rate limits must not block
  # publishing, so failures here are reported but do not gate the upload.
  live-smoke:
    name: Live engine smoke (non-blocking)
    needs: build-linux
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      MST_ITEST: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: wheels-linux-314
          path: wheel/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install wheel and run live tests
        run: |
          python -m venv .venv-live
          .venv-live/bin/python -m pip install --upgrade --quiet pip
          .venv-live/bin/python -m pip install --quiet pytest
          .venv-live/bin/python -m pip install --quiet wheel/*.whl
          .venv-live/bin/python -m pytest python/tests -q -k live

  # --- Publish (tag pushes only) ---------------------------------------------
  upload:
    name: Upload to PyPI
    needs: [build-linux, build-macos, build-windows, verify-wheels, wheel-coverage]
    # Tag pushes publish automatically; a manual dispatch with `tag` is the
    # deliberate recovery path for an existing tag (e.g. runner failures).
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: Check distributions
        run: |
          python -m pip install --quiet twine
          twine check dist/*

      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        # Recovery dispatches may rebuild an existing tag; skip files already on
        # PyPI instead of failing the whole upload.
        run: twine upload --skip-existing dist/*
