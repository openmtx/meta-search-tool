name: Publish mst-python to PyPI

on:
  push:
    tags:
      - "v*"  # same tag as the CLI (release.yml) — one tag releases both
  workflow_dispatch:  # build+test only; the upload job is gated to tag pushes

permissions:
  contents: write
  id-token: write  # required for trusted publishing (PyPI)

jobs:
  pin-check:
    name: Verify skill pin matches release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check skills/web-search pin
        run: ./scripts/check_skill_pin.sh

  # --- Linux: build in a manylinux_2_34 container ---------------------------
  # Go's c-shared runtime (go.mod "go 1.26") references GLIBC_2.34 symbols, so
  # the wheel floor is manylinux_2_34 (RHEL 9 / Ubuntu 22.04+). Building on
  # ubuntu-latest and repairing with auditwheel fails (too-new glibc symbols),
  # so we build inside the container, then auditwheel-repair to the same plat.
  build-linux:
    name: manylinux_2_34 x86_64 · Python ${{ matrix.py }}
    runs-on: ubuntu-latest
    needs: pin-check
    env:
      MST_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
    strategy:
      fail-fast: false
      matrix:
        py: [311, 312, 313, 314]
    steps:
      - uses: actions/checkout@v4

      - name: Build + repair manylinux_2_34 wheel
        run: |
          docker run --rm \
            -v "$PWD":/work -w /work \
            -e MST_VERSION="$MST_VERSION" \
            -e PY="$PY" \
            quay.io/pypa/manylinux_2_34_x86_64 bash -c '
              set -euxo pipefail
              # Install Go — pin matches go.mod "go 1.26"; bump with the directive.
              curl -sSL https://go.dev/dl/go1.26.4.linux-amd64.tar.gz | tar -C /usr/local -xz
              export PATH=/usr/local/go/bin:$PATH CGO_ENABLED=1

              PY=$PY
              PYBIN=/opt/python/$PY/bin

              "$PYBIN/python" -m pip install --upgrade --quiet build cython auditwheel
              ( cd /work/python && "$PYBIN/python" -m build --wheel )
              "$PYBIN/python" -m auditwheel repair /work/python/dist/*.whl \
                -w /work/wheels --plat manylinux_2_34_x86_64 || true
              rm -rf /work/python/dist /work/python/build \
                     /work/python/src/mst/_mst.c /work/python/src/mst.egg-info
            '
        env:
          PY: "cp${{ matrix.py }}-cp${{ matrix.py }}"

      - name: Upload Linux wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.py }}
          path: wheels/*.whl
          if-no-files-found: error

  # --- macOS: native build (no auditwheel needed; libSystem is system) -------
  build-macos:
    name: macOS ${{ matrix.arch }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    needs: pin-check
    env:
      CGO_ENABLED: "1"
      MST_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 = Apple Silicon (arm64). Intel (macos-13) runners have
          # chronic queue delays on GH Actions; users on Intel Macs can use the
          # Go CLI binary (darwin-amd64) built by release.yml or pip install
          # from source.
          - { os: macos-14, arch: arm64, python: "3.11" }
          - { os: macos-14, arch: arm64, python: "3.12" }
          - { os: macos-14, arch: arm64, python: "3.13" }
          - { os: macos-14, arch: arm64, python: "3.14" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"

      - name: Build wheel
        run: |
          python -m pip install --upgrade --quiet build cython
          cd python && python -m build --wheel

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.arch }}-${{ matrix.python }}
          path: python/dist/*.whl
          if-no-files-found: error

  # --- Windows: native build (CGO produces .dll on Windows) -----------------
  build-windows:
    name: Windows x64 · Python ${{ matrix.python }}
    runs-on: windows-latest
    needs: pin-check
    env:
      CGO_ENABLED: "1"
      MST_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"

      - name: Build wheel
        run: |
          python -m pip install --upgrade --quiet build cython
          cd python
          python -m build --wheel

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.python }}
          path: python/dist/*.whl
          if-no-files-found: error

  # --- Publish (tag pushes only) ---------------------------------------------
  upload:
    name: Upload to PyPI
    needs: [build-linux, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')  # never publish on workflow_dispatch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: Check distributions
        run: |
          python -m pip install --quiet twine
          twine check dist/*

      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
