name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  pin-check:
    name: Verify skill pin matches release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check skills/web-search pin
        run: ./scripts/check_skill_pin.sh

  # Cross-compilation never executes the target code, so a tag could ship
  # binaries that do not even start. Run the Go suite on the tagged commit
  # before building anything for release.
  go-test:
    name: go test ./...
    needs: pin-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    needs: [pin-check, go-test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
          - os: windows
            arch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          tag="${{ github.ref_name }}"
          os="${{ matrix.os }}"
          arch="${{ matrix.arch }}"
          bin="mst"
          [[ "$os" == "windows" ]] && bin="mst.exe"

          go build -ldflags="-X main.version=$tag -X github.com/openmtx/meta-search-tool/internal/engine.UserAgentVersion=$tag" -o "$bin" ./cmd/mst

          # Package: mst-<tag>-<os>-<arch>.tar.gz or .zip
          dir="mst-${tag}-${os}-${arch}"
          mkdir "$dir"
          cp "$bin" LICENSE "$dir/"

          if [[ "$os" == "windows" ]]; then
            zip -r "${dir}.zip" "$dir/"
            echo "artifact=${dir}.zip" >> "$GITHUB_ENV"
          else
            tar czf "${dir}.tar.gz" "$dir/"
            echo "artifact=${dir}.tar.gz" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: mst-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ env.artifact }}
          if-no-files-found: error

  # --- Smoke: run the shipped binaries on their native platform --------------
  # release.yml builds every target by cross-compilation on ubuntu-latest, so
  # no produced binary has ever been executed before being attached to a
  # release. Run the targets that have a matching hosted runner and let
  # --list-engines prove the binary starts and the engine registry initializes
  # (it short-circuits before query resolution, so no network is needed).
  # Remaining targets (linux-arm64, darwin-amd64, windows-arm64) stay covered
  # by go-test; hosted runners for them are impractical here.
  smoke:
    name: Smoke ${{ matrix.target }}
    needs: build
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-amd64, runner: ubuntu-latest }
          - { target: darwin-arm64, runner: macos-latest }
          - { target: windows-amd64, runner: windows-latest }
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mst-${{ github.ref_name }}-${{ matrix.target }}
          path: pkg/

      - name: Run --list-engines with the shipped binary
        run: |
          cd pkg
          # GNU tar (Git Bash on Windows) cannot read .zip, and unzip is not on
          # PATH there — extract via python's stdlib for zip, tar for tar.gz.
          shopt -s nullglob
          zips=(mst-*.zip)
          tars=(mst-*.tar.gz)
          if [ ${#zips[@]} -gt 0 ]; then
            python -c "import zipfile, sys; zipfile.ZipFile(sys.argv[1]).extractall()" "${zips[0]}"
          else
            tar -xf "${tars[0]}"
          fi
          cd mst-*/
          chmod +x mst*
          BIN="./mst"
          [[ "$RUNNER_OS" == "Windows" ]] && BIN="./mst.exe"
          "$BIN" --list-engines > engines.json
          python - <<'EOF'
          import json
          engines = json.load(open("engines.json"))
          assert isinstance(engines, list) and engines, "empty engine registry"
          for engine in engines:
              assert {"name", "enabled"} <= set(engine), engine
          names = {engine["name"] for engine in engines}
          for required in ("ddg", "wikipedia"):
              assert required in names, f"missing engine {required}"
          print(f"smoke ok: {len(engines)} engines listed")
          EOF

  release:
    name: Create Release
    needs: [build, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mst-*
          merge-multiple: true

      - name: Checksums
        run: sha256sum mst-*.* > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            mst-*.*
            SHA256SUMS.txt
          generate_release_notes: true
