[build-system]
requires = ["setuptools>=70.0", "cython>=3.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mst-python"
readme = "README.md"
# Version is derived from the release tag by setup.py (single source of truth
# shared with the Go CLI). See resolve_version() in setup.py.
dynamic = ["version"]
description = "CGO Python bindings for mst (Meta-Search Tool) — concurrent multi-engine web search with RRF ranking"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "mst contributors"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
